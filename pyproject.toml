[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "view-scheduler"
version = "0.2.0"
description = "Recommend when a Unity Catalog view can be materialized with every dependency already refreshed"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Kiran B" }]
keywords = ["databricks", "unity-catalog", "delta", "scheduling"]

classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "databricks-sdk>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=1.0",
]

[project.scripts]
view-scheduler = "view_scheduler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# src layout: only view_scheduler ships. rig/, tests/ and tools/ are repo-only
# and stay out of the wheel — `unzip -l dist/*.whl` is the check.
