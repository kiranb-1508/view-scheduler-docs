# Fixture rig for the view materialization scheduler.
#
# Seven jobs, one per time slot, all running the same task with a different
# --slot argument. What each slot writes on a given day is decided by
# rig/plan.py, deterministically from the date, so the expected history can be
# computed independently and asserted against the analyzer's output.
#
# The rig stops itself: past plan.RIG_END the task pauses every job whose name
# contains "sched_rig" instead of writing. `databricks bundle destroy` removes
# them outright.
#
# Window: 2026-08-31 to 2026-09-29.

bundle:
  name: sched_rig

targets:
  # development mode normally pauses schedules on deploy; each job sets
  # pause_status UNPAUSED explicitly, which the deploy must honour. Verified
  # after deploying rather than assumed.
  dev:
    mode: development
    default: true

resources:
  jobs:
    slot_0020:
      name: sched_rig 00:20 IST
      tags:
        rig: sched_rig
      schedule:
        quartz_cron_expression: "0 20 0 * * ?"
        timezone_id: Asia/Kolkata
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      tasks:
        - task_key: write
          spark_python_task:
            python_file: ./write_slot.py
            parameters: ["--slot", "00:20"]
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "3"
    slot_0200:
      name: sched_rig 02:00 IST
      tags:
        rig: sched_rig
